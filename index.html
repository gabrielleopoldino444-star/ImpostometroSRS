<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Impostômetro de Santa Rita do Sapucaí - MG</title>
  <meta name="description" content="Acompanhe em tempo real a arrecadação de tributos e o orçamento de Santa Rita do Sapucaí - MG." />
  <meta property="og:title" content="Impostômetro - Santa Rita do Sapucaí" />
  <meta property="og:description" content="Veja quanto a cidade já arrecadou em impostos este ano em tempo real." />
  <meta property="og:type" content="website" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080e1e;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 14px;
    }
    .card {
      background: #111c35;
      border: 1px solid #1e2d4d;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      max-width: 540px;
      width: 100%;
    }
    .header-tag {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .badge-primary {
      background: #0284c7;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 9999px;
    }
    .filter-group select {
      background: #0b1326;
      color: #94a3b8;
      border: 1px solid #223254;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .main-focus {
      text-align: center;
      margin-bottom: 20px;
    }
    .city-title {
      color: #f8fafc;
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .city-subtitle {
      color: #64748b;
      font-size: 0.82rem;
      margin-bottom: 16px;
    }
    .display-box {
      background: linear-gradient(180deg, rgba(14, 165, 233, 0.1) 0%, rgba(14, 165, 233, 0.02) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 18px 10px;
      margin-bottom: 18px;
    }
    .display-value {
      font-size: 2.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #38bdf8;
      letter-spacing: -0.5px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: #0b1326;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid #1a2744;
      text-align: center;
    }
    .metric-card span {
      display: block;
      color: #64748b;
      font-size: 0.68rem;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .metric-card strong {
      color: #e2e8f0;
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
    }
    .chart-section {
      border-top: 1px solid #1e2d4d;
      padding-top: 18px;
      margin-bottom: 20px;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .chart-title {
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .chart-toggle-btn {
      background: transparent;
      border: 1px solid #24355a;
      color: #94a3b8;
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .chart-toggle-btn.active {
      background: #1e2d4d;
      color: #38bdf8;
      border-color: #38bdf8;
    }
    .chart-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bar-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .bar-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
    }
    .bar-label {
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bar-label.highlight {
      color: #38bdf8;
      font-weight: 700;
    }
    .pill {
      background: #0284c7;
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .bar-value {
      color: #e2e8f0;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .bar-track {
      background: #0b1326;
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #1a2744;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .bar-fill.highlight {
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }
    .bar-fill.subdued {
      background: #475569;
    }
    .share-btn {
      width: 100%;
      background: #22c55e;
      color: #042f13;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .share-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-tag">
      <span class="badge-primary">Painel Regional</span>
      <div class="filter-group">
        <select id="categorySelect">
          <option value="total">Orçamento Total</option>
          <option value="municipal">Tributos Próprios (IPTU/ISS)</option>
          <option value="repasses">Repasses (ICMS/FPM/IPVA)</option>
        </select>
      </div>
    </div>

    <div class="main-focus">
      <h1 class="city-title">Santa Rita do Sapucaí - MG</h1>
      <p class="city-subtitle" id="categorySubtitle">Estimativa de arrecadação acumulada este ano</p>
      
      <div class="display-box">
        <div class="display-value" id="srCounter">R$ 0,00</div>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <span>Arrecadação / s</span>
        <strong id="srRate">R$ 0,00</strong>
      </div>
      <div class="metric-card">
        <span>Por Habitante</span>
        <strong id="srPerCapita">R$ 0,00</strong>
      </div>
      <div class="metric-card">
        <span>Previsão Anual</span>
        <strong id="srAnnual">R$ 190 mi</strong>
      </div>
    </div>

    <div class="chart-section">
      <div class="chart-header">
        <span class="chart-title">Comparativo Regional</span>
        <div>
          <button id="btnTotal" class="chart-toggle-btn active">Total</button>
          <button id="btnPerCapita" class="chart-toggle-btn">Por Habitante</button>
        </div>
      </div>

      <div class="chart-list" id="chartContainer"></div>
    </div>

    <button class="share-btn" onclick="compartilharWhatsApp()">
      <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.694.072-2.18-.544-1.898-.788-3.125-2.73-3.22-2.856-.095-.127-.771-1.026-.771-1.956 0-.93.486-1.386.66-1.576.174-.189.38-.237.507-.237.126 0 .253.001.364.007.118.006.276-.045.431.328.16.386.545 1.332.593 1.43.048.098.08.213.016.34-.064.127-.096.206-.19.317-.095.111-.2.247-.286.332-.095.095-.195.199-.084.39.111.19.493.813 1.057 1.316.726.647 1.337.848 1.528.943.19.095.301.079.412-.048.111-.127.476-.555.603-.745.127-.19.254-.158.428-.095.175.063 1.11.523 1.3.618.19.095.317.142.365.222.047.079.047.46-.096.865z"/>
      </svg>
      Compartilhar no WhatsApp
    </button>
  </div>

  <script>
    const DADOS = {
      santa_rita: {
        nome: "Santa Rita do Sapucaí",
        populacao: 44000,
        destaque: true,
        orcamento: {
          total: 190000000,
          municipal: 42000000,
          repasses: 148000000
        }
      },
      pouso_alegre: {
        nome: "Pouso Alegre (Demonstrativo)",
        populacao: 160000,
        destaque: false,
        orcamento: {
          total: 1400000000,
          municipal: 450000000,
          repasses: 950000000
        }
      },
      itajuba: {
        nome: "Itajubá (Demonstrativo)",
        populacao: 95000,
        destaque: false,
        orcamento: {
          total: 420000000,
          municipal: 110000000,
          repasses: 310000000
        }
      }
    };

    const SUBTITULOS = {
      total: "Orçamento Total Municipal acumulado este ano",
      municipal: "Apenas Tributos Próprios (IPTU, ISS, Taxas)",
      repasses: "Apenas Repasses Externos (ICMS, IPVA, FPM, SUS)"
    };

    const SEGUNDOS_NO_ANO = 365.25 * 24 * 60 * 60;
    const agora = new Date();
    const inicioDoAno = new Date(agora.getFullYear(), 0, 1, 0, 0, 0).getTime();

    let modoGrafico = "total";
    const categorySelect = document.getElementById("categorySelect");
    const btnTotal = document.getElementById("btnTotal");
    const btnPerCapita = document.getElementById("btnPerCapita");

    btnTotal.addEventListener("click", () => {
      modoGrafico = "total";
      btnTotal.classList.add("active");
      btnPerCapita.classList.remove("active");
    });

    btnPerCapita.addEventListener("click", () => {
      modoGrafico = "perCapita";
      btnPerCapita.classList.add("active");
      btnTotal.classList.remove("active");
    });

    function formatBRL(valor, compact = false) {
      if (compact && valor >= 1000000) {
        return "R$ " + (valor / 1000000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mi";
      }
      return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function atualizarPainel() {
      const categoria = categorySelect.value;
      const agoraMs = Date.now();
      const segundosPassados = (agoraMs - inicioDoAno) / 1000;
      
      document.getElementById("categorySubtitle").textContent = SUBTITULOS[categoria];

      // Atualiza Santa Rita do Sapucaí
      const srData = DADOS.santa_rita;
      const srAnual = srData.orcamento[categoria];
      const srTaxaSeg = srAnual / SEGUNDOS_NO_ANO;
      const srAcumulado = segundosPassados * srTaxaSeg;
      const srPorHab = srAcumulado / srData.populacao;

      document.getElementById("srCounter").textContent = formatBRL(srAcumulado);
      document.getElementById("srRate").textContent = formatBRL(srTaxaSeg) + "/s";
      document.getElementById("srPerCapita").textContent = formatBRL(srPorHab);
      document.getElementById("srAnnual").textContent = formatBRL(srAnual, true);

      // Atualiza o Gráfico Comparativo
      const chartContainer = document.getElementById("chartContainer");
      chartContainer.innerHTML = "";

      const valoresCidades = Object.keys(DADOS).map(key => {
        const item = DADOS[key];
        const anual = item.orcamento[categoria];
        const taxa = anual / SEGUNDOS_NO_ANO;
        const acumulado = segundosPassados * taxa;
        const valorExibido = modoGrafico === "total" ? acumulado : (acumulado / item.populacao);

        return {
          key,
          nome: item.nome,
          destaque: item.destaque,
          valor: valorExibido
        };
      });

      const maxValor = Math.max(...valoresCidades.map(c => c.valor));

      valoresCidades.forEach(item => {
        const percentual = maxValor > 0 ? (item.valor / maxValor) * 100 : 0;
        
        const row = document.createElement("div");
        row.className = "bar-row";
        row.innerHTML = `
          <div class="bar-info">
            <span class="bar-label ${item.destaque ? 'highlight' : ''}">
              ${item.destaque ? '<span class="pill">SUA CIDADE</span>' : ''}
              ${item.nome}
            </span>
            <span class="bar-value">${formatBRL(item.valor)}</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill ${item.destaque ? 'highlight' : 'subdued'}" style="width: ${percentual}%"></div>
          </div>
        `;
        chartContainer.appendChild(row);
      });
    }

    function compartilharWhatsApp() {
      const valor = document.getElementById("srCounter").textContent;
      const texto = encodeURIComponent(
        `🏛️ *Impostômetro de Santa Rita do Sapucaí - MG*\n\n` +
        `A arrecadação municipal acumulada este ano já atingiu *${valor}*!\n\n` +
        `Confira o painel em tempo real: ${window.location.href}`
      );
      window.open(`https://api.whatsapp.com/send?text=${texto}`, "_blank");
    }

    categorySelect.addEventListener("change", atualizarPainel);
    setInterval(atualizarPainel, 50);
    atualizarPainel();
  </script>
</body>
</html>
